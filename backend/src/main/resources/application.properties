# ---- SecureBank (ACADEMIC DEMO - simulated funds only) ----
server.port=${PORT:8080}

# Database: override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/securebank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Schema is created by database/schema.sql (single source of truth)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT: the default below is for LOCAL DEVELOPMENT ONLY. Set JWT_SECRET (>= 32 chars) elsewhere.
securebank.jwt.secret=${JWT_SECRET}
securebank.jwt.expiration-minutes=60

# Allowed frontend origin(s), comma separated
securebank.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Creates demo accounts on startup (LOCAL DEVELOPMENT ONLY - set to false otherwise)
securebank.seed-demo-data=${SEED_DEMO_DATA:true}
